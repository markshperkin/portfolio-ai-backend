networks:
  portfolio:

volumes:
  caddy_data:

services:
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    networks: [portfolio]

  backend-test:
    image: ghcr.io/markshperkin/portfolio-ai-backend:test
    restart: unless-stopped
    env_file: .env.test
    volumes:
      - ./data/test:/app/data
      - ./knowledge/test/clean_data:/knowledge:ro
    networks: [portfolio]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /home/appuser:rw,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 1.0
    mem_limit: 1024m
    pids_limit: 200

  frontend-test:
    image: ghcr.io/markshperkin/portfolio-ai-frontend:test
    restart: unless-stopped
    networks: [portfolio]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 200

  backend-prod:
    image: ghcr.io/markshperkin/portfolio-ai-backend:prod
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - ./data/prod:/app/data
      - ./knowledge/prod/clean_data:/knowledge:ro
    networks: [portfolio]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /home/appuser:rw,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 1.0
    mem_limit: 1024m
    pids_limit: 200

  frontend-prod:
    image: ghcr.io/markshperkin/portfolio-ai-frontend:prod
    restart: unless-stopped
    networks: [portfolio]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 200
